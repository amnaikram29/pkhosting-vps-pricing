<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PKHosting VPS Hosting</title>
  <link rel="stylesheet" href="css/style.css">

</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="container site-header-inner">
      <a class="brand" href="#" aria-label="PKHosting">
        <span class="brand-text" aria-hidden="true">PK</span>
        <svg class="brand-icon" viewBox="0 0 44 44" aria-hidden="true" focusable="false">
          <rect x="5" y="5" width="34" height="9.5" rx="2.2" fill="#e9e7e4" stroke="#d7d4d0" stroke-width="0.6"/>
          <rect x="25.5" y="8" width="3.4" height="3.4" rx="0.8" fill="#57514d"/>
          <rect x="30.5" y="8" width="3.4" height="3.4" rx="0.8" fill="#d8232a"/>
          <rect x="5" y="17.25" width="34" height="9.5" rx="2.2" fill="#1aa54a"/>
          <rect x="25.5" y="20.25" width="3.4" height="3.4" rx="0.8" fill="#fff"/>
          <rect x="30.5" y="20.25" width="3.4" height="3.4" rx="0.8" fill="#fff"/>
          <rect x="5" y="29.5" width="34" height="9.5" rx="2.2" fill="#e9e7e4" stroke="#d7d4d0" stroke-width="0.6"/>
          <rect x="25.5" y="32.5" width="3.4" height="3.4" rx="0.8" fill="#57514d"/>
          <rect x="30.5" y="32.5" width="3.4" height="3.4" rx="0.8" fill="#57514d"/>
        </svg>
        <span class="brand-text" aria-hidden="true">Host<span class="brand-i">&#305;</span>ng</span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">
        <svg class="nav-toggle-open" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M3 5h14M3 10h14M3 15h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="nav-toggle-close" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M4 4l12 12M16 4L4 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <ul class="nav-list">
          <li><a class="nav-link" href="#plans">Plans</a></li>
          <li><a class="nav-link" href="#compare">Compare</a></li>
          <li><a class="nav-link" href="#faq">FAQ</a></li>
          <li><a class="nav-link" href="#payments">Payments</a></li>
          <li class="nav-cta"><a class="btn btn-primary" href="#plans">Get Started
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a></li>
        </ul>
      </nav>
    </div>

  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <div class="container hero-inner">
        <h1 class="hero-title" id="hero-title">VPS hosting that bills in rupees</h1>
        <p class="hero-lead">Four NVMe plans, from one small app to a dedicated

        <div class="hero-actions">
          <a class="btn btn-accent" href="#plans">Compare plans
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <a class="btn btn-outline" href="#compare">See every spec
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer></footer>
  <script src="js/app.js"></script>
